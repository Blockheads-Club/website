name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: '1'
          # The e2e web server runs `bun run build`, which bundles the latest Patcher release (scripts/build-patcher.ts).
          GITHUB_TOKEN: ${{ github.token }}

