name = "blockheads-club-website"
compatibility_date = "2025-10-01"

# Assets-only Worker (no script, so requests never count as Worker invocations).
# Deployed by Cloudflare Workers Builds: build `bun run build`, deploy `npx wrangler deploy`,
# non-production branches `npx wrangler versions upload`. The static site is served from build/, including the
# web Patcher under build/patcher/ (scripts/build-patcher.mjs; see docs/development.md).
[assets]
directory = "./build"
# Unknown paths get the nearest 404.html walking up: build/patcher/404.html (the Patcher's app shell) for
# /patcher/*, build/404.html (the site's) elsewhere.
not_found_handling = "404-page"
