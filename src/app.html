<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#1f6feb" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bh-theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
        // Mirrors initLocale(): saved choice, else the browser language, so <html lang> is right before hydration.
        var codes = ['en', 'tr', 'ru', 'kk'];
        var l = null;
        try {
          l = localStorage.getItem('bh-locale');
        } catch (e) {}
        if (codes.indexOf(l) < 0) {
          l = 'en';
          var langs = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < langs.length; i++) {
            var c = String(langs[i]).toLowerCase().split('-')[0];
            if (codes.indexOf(c) >= 0) {
              l = c;
              break;
            }
          }
        }
        document.documentElement.lang = l;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
